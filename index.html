<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nick's E-Bike Repair & Sales</title>
  <script src="https://www.paypal.com/sdk/js?client-id=YOUR_PAYPAL_CLIENT_ID&currency=USD"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Roboto', sans-serif; margin: 0; background: #0f172a; color: white; }
    header { background: #020617; padding: 20px; text-align: center; }
    nav a { color: #38bdf8; margin: 0 10px; text-decoration: none; }
    .hero { padding: 40px; text-align: center; background: linear-gradient(90deg,#0ea5e9,#22c55e); }
    .container { padding: 20px; }
    .products { display: grid; grid-template-columns: repeat(auto-fit,minmax(250px,1fr)); gap: 20px; }
    .card { background: #1e293b; padding: 15px; border-radius: 10px; }
    .card img { width: 100%; border-radius: 10px; cursor:pointer; }
    button { background: #22c55e; border: none; padding: 10px; color: white; cursor: pointer; border-radius: 5px; }
    footer { text-align: center; padding: 20px; background: #020617; }
    .cart { position: fixed; top: 10px; right: 10px; background: #1e293b; padding: 10px; border-radius: 10px; }
    .gallery { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; justify-content:center; align-items:center; }
    .gallery img { max-width:90%; max-height:90%; }
    #adminPanel { display:none; background:#111827; padding:20px; }
    input, select, textarea { width:100%; margin-bottom:10px; padding:8px; border-radius:5px; border:none; }
  </style>
</head>
<body>

<header>
  <img src="logo.png" alt="Nick's E-Bike Logo" style="max-height:80px;">
  <p>Redefining riding one bike at a time.</p>
  <nav>
    <a href="#">Home</a>
    <a href="#products">Shop</a>
    <a href="#book">Book Repair</a>
    <a href="#admin" onclick="toggleAdmin()">Admin</a>
  </nav>
</header>

<div class="cart">
  Cart: <span id="cartCount">0</span>
</div>

<section class="hero">
  <h2>Fast Repairs. Powerful Rides.</h2>
</section>

<div class="container" id="products">
  <h2>Shop E-Bikes</h2>
  <div class="products" id="productList"></div>
</div>

<div class="container" id="book">
  <h2>Book a Repair</h2>
  <form id="bookingForm" onsubmit="submitBooking(event)">
    <input type="text" placeholder="Full Name" id="customerName" required>
    <input type="tel" placeholder="Phone Number" id="customerPhone" required>
    <input type="email" placeholder="Email" id="customerEmail" required>
    <input type="text" placeholder="Bike Model" id="bikeModel" required>
    <textarea placeholder="Describe the Issue" id="issueDesc" required></textarea>
    <input type="datetime-local" id="preferredTime" required>
    <button type="submit">Book Repair</button>
  </form>
</div>

<div class="container" id="adminPanel">
  <h2>Admin Dashboard</h2>
  <h3>Add a New Bike</h3>
  <form id="adminForm" onsubmit="addProduct(event)">
    <input type="text" placeholder="Bike Name" id="newBikeName" required>
    <input type="number" placeholder="Price" id="newBikePrice" required>
    <input type="text" placeholder="Image URL (comma separated)" id="newBikeImages" required>
    <input type="text" placeholder="PayPal Link" id="newBikeLink" required>
    <button type="submit">Add Bike</button>
  </form>
  <h3>Bookings</h3>
  <ul id="bookingList"></ul>
</div>

<div class="gallery" id="gallery" onclick="closeGallery()">
  <img id="galleryImg">
</div>

<footer>
  <p>© 2026 Nick's E-Bike Repair | Phone: (555) 123-4567</p>
</footer>

<script>
let cart = [];
let products = [];
let bookings = [];

function toggleAdmin(){
  const panel = document.getElementById('adminPanel');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}

function renderProducts(){
  const container = document.getElementById("productList");
  container.innerHTML = "";
  products.forEach((p, index)=>{
    container.innerHTML += `<div class='card'>
      <img src='${p.images[0]}' onclick="openGallery('${p.images[0]}')">
      <h3>${p.name}</h3>
      <p>$${p.price}</p>
      <button onclick='addToCart(${index})'>Add to Cart</button>
      <div id='paypal-button-container-${index}'></div>
    </div>`;

    paypal.Buttons({
      createOrder: function(data, actions) {
        return actions.order.create({ purchase_units: [{ amount: { value: p.price } }] });
      },
      onApprove: function(data, actions) {
        return actions.order.capture().then(function(details) {
          alert('Transaction completed by ' + details.payer.name.given_name);
        });
      }
    }).render(`#paypal-button-container-${index}`);
  });
}

function addToCart(i){
  cart.push(products[i]);
  document.getElementById('cartCount').innerText = cart.length;
}

function openGallery(src){
  document.getElementById('gallery').style.display='flex';
  document.getElementById('galleryImg').src = src;
}
function closeGallery(){
  document.getElementById('gallery').style.display='none';
}

function addProduct(event){
  event.preventDefault();
  const name = document.getElementById('newBikeName').value;
  const price = document.getElementById('newBikePrice').value;
  const images = document.getElementById('newBikeImages').value.split(',');
  const link = document.getElementById('newBikeLink').value;
  products.push({name, price, images, link});
  renderProducts();
  document.getElementById('adminForm').reset();
}

function submitBooking(event){
  event.preventDefault();
  const booking = {
    name: document.getElementById('customerName').value,
    phone: document.getElementById('customerPhone').value,
    email: document.getElementById('customerEmail').value,
    bike: document.getElementById('bikeModel').value,
    issue: document.getElementById('issueDesc').value,
    time: document.getElementById('preferredTime').value
  };
  bookings.push(booking);
  renderBookings();
  document.getElementById('bookingForm').reset();
  alert('Booking submitted!');
}

function renderBookings(){
  const list = document.getElementById('bookingList');
  list.innerHTML='';
  bookings.forEach((b,i)=>{
    list.innerHTML += `<li>${b.time} - ${b.name} (${b.bike}) - ${b.issue}</li>`;
  });
}

renderProducts();
</script>

</body>
</html>
